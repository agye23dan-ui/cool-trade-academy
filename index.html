<style>
:root{--bg:#eef6f9;--card:#fff;--ink:#12303f;--mut:#5a7585;--cold:#1f78a6;--hot:#d2452f;--cu:#b8693a;--line:#cfe0e8}
@media(prefers-color-scheme:dark){:root{--bg:#0c1d27;--card:#13303f;--ink:#e6f2f7;--mut:#97b3c2;--cold:#5bb5e0;--hot:#f0705a;--cu:#e39a6a;--line:#244a5d}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-enter{animation:fadeIn .18s ease both}
*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0f3b52;color:#e9f6fb;padding:14px 18px;position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center}
header a{color:inherit;text-decoration:none;font-weight:700;font-size:1.15rem}
main{padding:24px clamp(16px,3vw,40px) 60px}
h1,h2,h3{line-height:1.25}h3{color:var(--cold);margin:1.4em 0 .3em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0;display:block;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--cold)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill{font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--mut);white-space:nowrap}.pill.ok{background:var(--cold);color:#fff}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cold)}
button{font:inherit;background:var(--cold);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--cu);outline-offset:2px}
.q{border-top:1px solid var(--line);padding:12px 0}.q label{display:block;padding:6px 8px;border-radius:6px;cursor:pointer}
.good{background:rgba(31,160,100,.18)}.bad{background:rgba(210,69,47,.18)}.why{color:var(--mut);font-size:.92rem;margin:4px 8px}
svg text{fill:var(--ink);font:600 13px system-ui}.node{cursor:pointer}.node rect{fill:var(--card);stroke-width:3}
input[type=number]{font:inherit;width:100px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
ul{padding-left:1.2em}.note{border-left:4px solid var(--cu);padding:2px 12px;background:var(--card)}
svg .f{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}svg .h{stroke:var(--hot)}svg .c{stroke:var(--cold)}svg .w{fill:var(--card)}svg .t{fill:var(--ink)}svg.sm text{font-size:10.5px}details summary{cursor:pointer}.wk{border:1px solid var(--line);border-left:4px solid var(--cu);border-radius:8px;padding:8px 16px;background:var(--card);margin:12px 0}.wk ol{margin:.4em 0}.wk .ans{margin:.3em 0;color:var(--cold);font-weight:600}.cs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.cs input,.cs select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:110px}.cs select{width:auto}.wkout{background:var(--bg);border-radius:8px;padding:6px 14px;margin-top:8px}.wkout ol{margin:.3em 0}
.layout{display:flex;align-items:flex-start}main{flex:1;min-width:0}
aside{width:230px;flex:none;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:10px 8px}
aside a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none}
aside a:hover{background:var(--bg)}aside a.on{background:var(--cold);color:#fff}aside a.on .pill{background:rgba(255,255,255,.25);color:#fff}
aside h4{margin:14px 12px 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
svg[viewBox]{max-width:none}.zb{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin:4px 0;color:var(--mut);font-size:.85rem}.zb button{padding:2px 12px;font-size:1rem}.zs{overflow:auto;text-align:center}
#menu{display:none;background:none;padding:2px 8px;font-size:1.4rem;color:#fff}
.diag-card{margin:16px 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cold);border-radius:10px}.diag-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}.diag-badge{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cold);background:rgba(31,120,166,.12);padding:2px 8px;border-radius:99px}.diag-title{font-size:.95rem;color:var(--ink)}.diag-task{font-size:.85rem;color:var(--mut);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}.diag-task a{color:var(--cold);text-decoration:underline;margin-left:6px}
@media(max-width:800px){#menu{display:block}aside{position:fixed;left:0;top:52px;bottom:0;height:auto;z-index:4;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.3)}aside.open{transform:none}}
</style></head><body>
